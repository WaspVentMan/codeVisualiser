<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Code Visualiser</title>
</head>
<body style="margin: 0%; overflow: hidden;">
    <div onclick="visualise(); this.remove()" style="width: 100%; height: 100%; text-align: center; background-color: gray; position: absolute;">
        <h1 style="position: absolute; top: calc(50vh - 19px); width: 100%;">CLICK TO START</h1>
    </div>
    <div style="width: 100%; height: 100vh; display: flex;">
        <div class="codeViewer" style="width: 25%; height: 100vh; overflow: hidden; background-color: lightgray;"></div>
        <div class="codeViewer2" style="width: 75%; height: 100vh; overflow: hidden; background-color: lightgray;"></div>
    </div>
    <div class="stats" style="position: absolute; bottom: 16px; right: 16px; width: max-content; background-color: white;"></div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
